name: Build and publish Android release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: worldway-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Restore the existing signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.WORLDWAY_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/worldway.keystore"
          chmod 600 "$RUNNER_TEMP/worldway.keystore"
          echo "WORLDWAY_KEYSTORE=$RUNNER_TEMP/worldway.keystore" >> "$GITHUB_ENV"
      - name: Build and test
        env:
          WORLDWAY_STORE_PASSWORD: ${{ secrets.WORLDWAY_STORE_PASSWORD }}
          WORLDWAY_KEY_ALIAS: ${{ secrets.WORLDWAY_KEY_ALIAS }}
          WORLDWAY_KEY_PASSWORD: ${{ secrets.WORLDWAY_KEY_PASSWORD }}
        run: |
          test -n "$WORLDWAY_STORE_PASSWORD"
          test -n "$WORLDWAY_KEY_ALIAS"
          test -n "$WORLDWAY_KEY_PASSWORD"
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease -Pksp.incremental=false
      - name: Prepare and verify APK
        run: |
          VERSION_NAME=$(sed -n 's/^VERSION_NAME=//p' version.properties | tr -d '\r')
          VERSION_CODE=$(sed -n 's/^VERSION_CODE=//p' version.properties | tr -d '\r')
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          APK="WorldWay-$VERSION_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/signature.txt"
          grep -qi 'a8e2b489cfebcc2b613f07ea221b0c22e0773a18b52b4f352cdde3b31f3f6e0e' "$RUNNER_TEMP/signature.txt"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "APK=$APK" >> "$GITHUB_ENV"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" "$APK" --title "$VERSION_NAME ($VERSION_CODE)" --notes-file RELEASE_NOTES.md --latest
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/worldway.keystore"
